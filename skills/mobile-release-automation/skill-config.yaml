---
# Mobile Release Automation — Skill Configuration
# Version: 1.0.0

skill:
  name: mobile-release-automation
  version: "1.0.0"
  type: automation

context_detection:
  priority_order:
    - path: "CLAUDE.md"
      note: "Highest priority — project-specific release steps override all defaults"
    - path: ".github/workflows/release*.yml"
      note: "Detect CI/CD release workflow name and trigger parameters"
    - path: ".github/workflows/upload-testflight*.yml"
    - path: "Podfile"
      note: "CocoaPods project"
    - path: "Package.swift"
      note: "SPM project"
    - path: "Configurations/*.xcconfig"
      note: "xcconfig-based versioning (Xcode 13+)"
    - path: "*/Info.plist"
      note: "Legacy plist-based versioning"

  version_location_detection:
    xcconfig:   ["MARKETING_VERSION", "CURRENT_PROJECT_VERSION"]
    plist:      ["CFBundleShortVersionString", "CFBundleVersion"]
    podspec:    ["s.version"]
    spm:        ["let version"]
    note: "Detect all version locations before Phase 2 — bump all consistently"

  dependency_manager:
    spm:        ["Package.swift", "Package.resolved"]
    cocoapods:  ["Podfile", "Podfile.lock"]
    carthage:   ["Cartfile", "Cartfile.resolved"]

  workflow_detection:
    release_build:   ["release*.yml", "build*.yml", "archive*.yml"]
    testflight:      ["testflight*.yml", "upload*.yml", "distribute*.yml"]
    note: "Detect actual workflow file names before triggering"

  branching_strategy:
    gitflow:    "release/* branch → merge to main + develop"
    trunkbased: "release/* branch → merge to main only"
    note: "Detect from CLAUDE.md or branch history patterns"

# ============================================================
# RULE FILES
# ============================================================

dimensions:

  pre_release_checks:
    rules_file: "rules/pre-release-checks.yaml"
    enabled: always

  versioning:
    rules_file: "rules/versioning.yaml"
    enabled: always

  changelog:
    rules_file: "rules/changelog.yaml"
    enabled: always

  dependency_audit:
    rules_file: "rules/dependency-audit.yaml"
    enabled: always

  release_hygiene:
    rules_file: "rules/release-hygiene.yaml"
    enabled: always

  security:
    rules_file: "rules/security.yaml"
    enabled: always

  github_pr_hygiene:
    rules_file: "rules/github-pr-hygiene.yaml"
    enabled: always

# ============================================================
# SEVERITY & SIGNAL
# ============================================================

severity_levels:
  CRITICAL: { action: "Block release",        emoji: "🔴" }
  HIGH:     { action: "Fix before release",    emoji: "🟠" }
  MEDIUM:   { action: "Fix if time allows",    emoji: "🟡" }
  LOW:      { action: "Fix in next cycle",     emoji: "🔵" }
  SUGGESTION: { action: "Consider later",      emoji: "💡" }

release_signal:
  blocked:    { condition: "any CRITICAL",               label: "🔴 Release blocked" }
  needs_work: { condition: "1+ HIGH OR 3+ MEDIUM",       label: "🟡 Needs work before release" }
  ready:      { condition: "only LOW or SUGGESTION",     label: "🟢 Ready to release" }

# ============================================================
# GUARDRAILS
# ============================================================

guardrails:
  - "Never push to main without explicit user confirmation"
  - "Never push a tag without explicit user confirmation"
  - "Never trigger App Store / TestFlight upload without explicit user confirmation"
  - "Never auto-merge release PR — require user approval"
  - "Never bump version directly on main — use release branch"
  - "CLAUDE.md overrides all defaults"
  - "Detect all version file locations before proposing bump commands"

fallback:
  no_version_input:        "Ask: What is the target version? (e.g. 2.1.0)"
  version_files_not_found: "Could not detect version files. Check CLAUDE.md for project layout."
  workflow_not_found:      "No release workflow detected. Provide .github/workflows/ path."
  no_changelog:            "CHANGELOG.md not found. Will create one at repo root."
