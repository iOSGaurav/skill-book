---
# Versioning Rules
# Validates that version numbers are bumped correctly in all required locations.

rule_set:
  id: versioning
  label: "Versioning"
  phase: 2
  enabled: always

checks:

  REL-VER-001:
    id: REL-VER-001
    title: "Marketing version follows SemVer x.y.z"
    severity: HIGH
    rationale: >
      Non-SemVer version strings break automated tooling (changelogs, badge generators,
      SPM version resolution) and violate App Store Connect submission requirements.
    pattern: "^\\d+\\.\\d+\\.\\d+$"
    applies_to: [CFBundleShortVersionString, MARKETING_VERSION, s.version, Package.swift version]
    bad_example: "2.1"
    fix_example: "2.1.0"

  REL-VER-002:
    id: REL-VER-002
    title: "Build number is strictly greater than the previous release"
    severity: CRITICAL
    rationale: >
      App Store Connect rejects builds with a build number ≤ the last accepted build.
      This causes TestFlight upload failures and delays the release.
    applies_to: [CFBundleVersion, CURRENT_PROJECT_VERSION]
    fix: "Use CI build number, timestamp (YYYYMMDDHHmm), or auto-increment. Never reuse."
    bad_example: "CURRENT_PROJECT_VERSION = 200  // previous was 247"
    fix_example: "CURRENT_PROJECT_VERSION = 248  // or $(date +%Y%m%d%H%M)"

  REL-VER-003:
    id: REL-VER-003
    title: "Version bumped consistently across all locations"
    severity: HIGH
    rationale: >
      Projects often have the marketing version in multiple places — xcconfig, Info.plist,
      podspec, Package.swift. A mismatch causes build warnings, wrong App Store metadata,
      or SPM resolution failures.
    applies_to: [all version file locations detected in Phase 2]
    detection: |
      grep -r "MARKETING_VERSION\|CFBundleShortVersionString\|s.version\|let version" \
        --include="*.plist" --include="*.xcconfig" --include="*.podspec" \
        --include="Package.swift" .
    fix: "Ensure all locations show the same version string."

  REL-VER-004:
    id: REL-VER-004
    title: "No prerelease or development version suffix in production build"
    severity: HIGH
    rationale: >
      Suffixes like `-dev`, `-alpha`, `-SNAPSHOT` in marketing version will be
      visible in App Store Connect and in the About screen. They fail the App Store
      review guidelines for production releases.
    detect:
      - "MARKETING_VERSION.*-dev"
      - "MARKETING_VERSION.*-alpha"
      - "MARKETING_VERSION.*-SNAPSHOT"
      - "CFBundleShortVersionString.*-"
    fix: "Remove any suffix. Use a plain x.y.z version string."

  REL-VER-005:
    id: REL-VER-005
    title: "Git tag exactly matches the marketing version"
    severity: HIGH
    rationale: >
      A mismatch between the git tag and the App Store version creates confusion
      when mapping crash reports (which use the marketing version) back to a commit.
    fix_example: "git tag -a 'v2.1.0' if MARKETING_VERSION = 2.1.0"
    bad_example: "tag v2.1 for version 2.1.0"

  REL-VER-006:
    id: REL-VER-006
    title: ".podspec version matches marketing version (for library releases)"
    severity: HIGH
    rationale: >
      CocoaPods validates that `pod spec lint` passes before publishing. A podspec
      version that doesn't match the git tag causes `pod trunk push` to fail.
    applies_to: [projects with .podspec files only]
    detection: "find . -name '*.podspec' -exec grep 's.version' {} \\;"
    fix: "sed -i '' \"s/s.version.*=.*/s.version = '{VERSION}'\" MyLib.podspec"

  REL-VER-007:
    id: REL-VER-007
    title: "Version bump committed before the release PR is opened"
    severity: HIGH
    rationale: >
      Opening the release PR without committing the version bump means CI builds
      the wrong version number. The commit must be part of the release branch.
    detection: "git log release/{VERSION} --oneline | grep 'bump version\\|chore: bump'"
    fix: "Commit the version bump on the release branch before opening the PR."

  REL-VER-008:
    id: REL-VER-008
    title: "Develop branch bumped to next snapshot version after release merges"
    severity: MEDIUM
    rationale: >
      Without a post-release version bump on develop, the next builds on develop
      will carry the released version number until someone manually bumps it,
      making build provenance ambiguous.
    applies_to: [GitFlow projects with a separate develop branch]
    fix: "After merging release → main, bump MARKETING_VERSION to x.(y+1).0-dev on develop."
