---
# Release Hygiene Rules
# Validates branch naming, PR format, tagging, artifact upload, and post-release cleanup.

rule_set:
  id: release_hygiene
  label: "Release Hygiene"
  phase: 8
  enabled: always

checks:

  REL-HYG-001:
    id: REL-HYG-001
    title: "Release branch follows naming convention release/x.y.z"
    severity: MEDIUM
    rationale: >
      Consistent branch naming enables CI filters, branch protection rules,
      automated changelogs, and release tooling to target the right branches.
    pattern: "^release/\\d+\\.\\d+\\.\\d+$"
    bad_example: "release-2.1, v2.1.0-release, gaurav/release"
    fix_example: "release/2.1.0"
    detection: "git branch --show-current | grep -E '^release/[0-9]+\\.[0-9]+\\.[0-9]+$'"

  REL-HYG-002:
    id: REL-HYG-002
    title: "Release PR targets main (not develop or a feature branch)"
    severity: HIGH
    rationale: >
      A release PR targeting develop will not update the production ref. The tag
      and GitHub release would point to the wrong commit.
    detection: "gh pr view {PR} --json baseRefName -q .baseRefName | grep -E '^(main|master)$'"
    fix: "Create the PR with --base main."

  REL-HYG-003:
    id: REL-HYG-003
    title: "Release PR approved by at least one release manager before merge"
    severity: HIGH
    rationale: >
      A second pair of eyes on the release checklist catches missed steps that are
      difficult to reverse after the tag is pushed and the build is in review.
    detection: "gh pr view {PR} --json reviewDecision -q .reviewDecision | grep APPROVED"
    fix: "Request review from a designated release manager. Do not self-merge."

  REL-HYG-004:
    id: REL-HYG-004
    title: "Git tag is annotated, not lightweight"
    severity: HIGH
    rationale: >
      Annotated tags store the tagger, date, and message — essential for auditing who
      tagged what and when. Lightweight tags are just pointers with no metadata.
      GitHub Releases require annotated tags for accurate attribution.
    detection: "git cat-file -t v{VERSION} | grep tag"
    bad_example: "git tag v2.1.0"
    fix_example: "git tag -a v2.1.0 -m 'Release 2.1.0'"

  REL-HYG-005:
    id: REL-HYG-005
    title: "dSYM uploaded to crash reporting service"
    severity: HIGH
    rationale: >
      Without dSYMs, crash reports from App Store / TestFlight show only memory
      addresses — impossible to debug. The upload must happen before the build
      reaches end users.
    applies_to: [Crashlytics/Firebase Crashlytics, Sentry, Datadog, Bugsnag]
    detection: "gh run view {RUN_ID} --log | grep -i 'dsym\\|upload.*crash'"
    fix: |
      Add a dSYM upload step to the release CI workflow.
      Crashlytics: upload-symbols -gsp GoogleService-Info.plist -p ios path/to/dSYMs
      Sentry: sentry-cli upload-dif --org ORG --project APP path/to/dSYMs

  REL-HYG-006:
    id: REL-HYG-006
    title: "GitHub Release created with IPA and dSYM artifacts"
    severity: HIGH
    rationale: >
      GitHub Releases serve as the canonical artifact store for each version.
      Attaching the IPA and dSYM ensures any team member can retrieve the exact
      build that shipped without requiring CI to be re-run.
    detection: |
      gh release view v{VERSION} --json assets -q '.assets[].name'
      # Expected: MyApp.ipa, MyApp.dSYM.zip
    fix: |
      gh release upload v{VERSION} ./build/MyApp.ipa ./build/MyApp.dSYM.zip

  REL-HYG-007:
    id: REL-HYG-007
    title: "Release branch deleted after merging"
    severity: MEDIUM
    rationale: >
      Keeping merged release branches pollutes the branch list and confuses
      future releases about which branch is active.
    detection: "git branch -r | grep 'release/{VERSION}'"
    fix: |
      gh api repos/$REPO/git/refs/heads/release/{VERSION} --method DELETE

  REL-HYG-008:
    id: REL-HYG-008
    title: "Release milestone closed after all issues resolved"
    severity: MEDIUM
    rationale: >
      An open milestone with a shipped version number misleads contributors into
      thinking there is still work to do for that version. Close it to preserve
      an accurate project history.
    detection: |
      gh api repos/$REPO/milestones \
        --jq ".[] | select(.title==\"v{VERSION}\") | .state"
      # Expected: closed
    fix: |
      MILESTONE=$(gh api repos/$REPO/milestones \
        --jq ".[] | select(.title==\"v{VERSION}\") | .number")
      gh api repos/$REPO/milestones/$MILESTONE --method PATCH -f state="closed"

  REL-HYG-009:
    id: REL-HYG-009
    title: "All release PR review comments resolved before merge"
    severity: HIGH
    rationale: >
      Unresolved review threads on a release PR indicate outstanding concerns that
      were never addressed. Merging with open threads creates an undocumented decision debt.
    detection: "gh pr view {PR} --json reviewThreads --jq '[.reviewThreads[] | select(.isResolved == false)] | length'"
    fix: "Resolve or explicitly dismiss each open review thread before merging."

  REL-HYG-010:
    id: REL-HYG-010
    title: "Release notes visible in App Store Connect match CHANGELOG entry"
    severity: MEDIUM
    rationale: >
      Inconsistent release notes between the GitHub release and App Store Connect
      confuse users who read both. Use the same text from CHANGELOG.md as the source.
    fix: |
      Copy the ## [{VERSION}] section from CHANGELOG.md into App Store Connect
      'What's New in This Version'. Omit any internal items.
