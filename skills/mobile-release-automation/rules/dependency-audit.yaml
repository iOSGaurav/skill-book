---
# Dependency Audit Rules
# Validates library versions, security, and license compliance before release.

rule_set:
  id: dependency_audit
  label: "Dependency Audit"
  phase: 3
  enabled: always

checks:

  REL-DEP-001:
    id: REL-DEP-001
    title: "No dependencies with known CVEs"
    severity: CRITICAL
    rationale: >
      Shipping a release with a dependency containing a known CVE exposes users to
      security vulnerabilities and may trigger App Store rejection or regulatory issues.
    detection: |
      # SPM — cross-reference Package.resolved against OSV database
      cat Package.resolved | jq '.pins[] | {identity, version}'
      # CocoaPods — check advisories
      bundle exec pod audit --verbose
    fix: "Update the affected dependency to a patched version or apply the vendor's workaround."

  REL-DEP-002:
    id: REL-DEP-002
    title: "No prerelease / beta / alpha dependencies in production build"
    severity: HIGH
    rationale: >
      Prerelease dependencies may have unstable APIs, known bugs, or incomplete
      documentation. App Store review may flag apps with prerelease frameworks.
    detect:
      - Package.resolved entries with version containing "alpha", "beta", "rc", "dev"
      - Podfile entries like `pod 'X', '1.0.0-beta.1'`
    fix: "Pin to the stable release version. If no stable release exists, evaluate an alternative."
    detection_commands: |
      cat Package.resolved | jq '.pins[] | select(.state.version | test("alpha|beta|rc|dev"))'
      grep -E "alpha|beta|rc" Podfile.lock

  REL-DEP-003:
    id: REL-DEP-003
    title: "No local path overrides in SPM (file:// or path:)"
    severity: CRITICAL
    rationale: >
      Local path overrides resolve to paths on the developer's machine. They will
      fail to resolve in CI and on any other machine, causing build failures.
    detection: "grep 'path:' Package.swift"
    fix: "Remove all .package(path: ...) entries. Use tagged versions or branch references."
    bad_example: |
      .package(path: "../MyLocalLib")
    fix_example: |
      .package(url: "https://github.com/org/MyLib.git", exact: "1.2.0")

  REL-DEP-004:
    id: REL-DEP-004
    title: "Package.resolved / Podfile.lock committed"
    severity: HIGH
    rationale: >
      Uncommitted lock files mean CI and the release branch may resolve to different
      dependency versions than the developer's machine, producing non-reproducible builds.
    detection: |
      git status Package.resolved Podfile.lock   # must both be clean
    fix: "git add Package.resolved Podfile.lock && git commit -m 'chore: lock dependencies for release'"

  REL-DEP-005:
    id: REL-DEP-005
    title: "No major-version-behind dependencies for critical libraries"
    severity: MEDIUM
    rationale: >
      Dependencies that are multiple major versions behind receive no security patches
      for old API surfaces. Plan upgrades proactively before they become forced.
    applies_to: [networking, auth, crypto, analytics libraries]
    detection_commands: |
      # SPM — compare Package.resolved against registry
      cat Package.resolved | jq '.pins[] | {identity, version}'
      # CocoaPods
      bundle exec pod outdated
    fix: "Flag for upgrade in the next sprint. Do not block the release unless the gap is > 2 major versions."

  REL-DEP-006:
    id: REL-DEP-006
    title: "All dependency licenses are App Store compatible"
    severity: HIGH
    rationale: >
      GPL and AGPL licenses are incompatible with App Store distribution. LGPL and
      MPL have restrictions that may require source disclosure. Apache 2.0 and MIT
      are always safe.
    licenses:
      allowed:    ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC"]
      restricted: ["LGPL", "MPL"]
      blocked:    ["GPL-2.0", "GPL-3.0", "AGPL-3.0"]
    detection: |
      # For SPM packages: check each repo's LICENSE file
      # For CocoaPods: check podspec license field
      cat Podfile.lock | grep -E "^\s{2}- " | sed 's/ (.*//'
    fix: "Replace GPL-licensed dependencies with MIT/Apache-licensed equivalents."

  REL-DEP-007:
    id: REL-DEP-007
    title: "No unused dependencies introduced in this release"
    severity: LOW
    rationale: >
      Unused imports increase binary size and attack surface. An unreferenced dependency
      added to Package.swift without usage is likely a mistake.
    detection: |
      # List SPM products and check for import usage
      cat Package.swift | grep '.product(name:' | awk '{print $3}' | tr -d '",'
      # Then grep for each product name in Swift source
    fix: "Remove unused .package() entries from Package.swift."

  REL-DEP-008:
    id: REL-DEP-008
    title: "CocoaPods private specs use HTTPS source URLs"
    severity: HIGH
    rationale: >
      Private spec repos using HTTP or SSH with password-embedded URLs expose credentials
      in CI logs and make reproducible builds difficult across machines.
    detection: "grep '^source' Podfile | grep -v 'https://'"
    fix: "Replace HTTP or SSH URLs with HTTPS in Podfile source declarations."
