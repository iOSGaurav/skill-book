---
# Security Rules
# Shared across all architecture skills (TCA, MVVM, VIPER)
# References: OWASP Mobile Top 10, Apple Security Guidelines

rule_set:
  id: security
  name: Security
  description: >
    Security vulnerability prevention for iOS apps.
    Covers secrets management, sensitive data storage, transport security,
    and information disclosure.
  enabled: always
  references:
    - https://owasp.org/www-project-mobile-top-10/
    - https://developer.apple.com/documentation/security

checks:

  SEC-001:
    description: No secrets, API keys, or tokens hardcoded in source
    severity: CRITICAL
    rationale: >
      Source code is often version-controlled and may be public or leaked.
      Hardcoded credentials give attackers permanent access and cannot be
      rotated without a full app release.
    owasp: M9 – Insecure Data Storage
    detection:
      patterns:
        - 'apiKey\s*=\s*"[A-Za-z0-9_\-]{20,}"'
        - 'secret\s*=\s*"[A-Za-z0-9_\-]{20,}"'
        - 'token\s*=\s*"[A-Za-z0-9_\-]{20,}"'
        - 'password\s*=\s*"[^"]+"'
        - 'AIza[0-9A-Za-z\-_]{35}'    # Google API key pattern
    bad_example: |
      let apiKey = "AIzaSyD4f8gHkLm2nR9xPqW3tY7uI5oE1aB6cZ0"
      let stripeKey = "sk_live_abc123xyz789"
    fix_example: |
      // Store in .xcconfig (gitignored) and read from Bundle
      let apiKey = Bundle.main.object(forInfoDictionaryKey: "API_KEY") as? String ?? ""

      // Or use a secrets management tool (e.g. Arkana, Tuist Secrets)

  SEC-002:
    description: Keychain used for sensitive data; not UserDefaults
    severity: HIGH
    rationale: >
      UserDefaults is stored as a plaintext plist under the app's container
      and is accessible without authentication on jailbroken devices.
      Keychain data is encrypted and protected by the Secure Enclave.
    owasp: M9 – Insecure Data Storage
    sensitive_data_examples:
      - Auth tokens and refresh tokens
      - Passwords and PINs
      - Private keys and certificates
      - PII (SSN, financial data)
    bad_example: |
      UserDefaults.standard.set(authToken, forKey: "auth_token")
      UserDefaults.standard.set(userPassword, forKey: "password")
    fix_example: |
      // Using KeychainAccess or native Security framework
      try keychain.set(authToken, key: "auth_token")

      // Native Security framework
      let query: [String: Any] = [
          kSecClass as String: kSecClassGenericPassword,
          kSecAttrAccount as String: "auth_token",
          kSecValueData as String: authToken.data(using: .utf8)!
      ]
      SecItemAdd(query as CFDictionary, nil)

  SEC-003:
    description: No HTTP URLs where HTTPS is available
    severity: HIGH
    rationale: >
      HTTP traffic is unencrypted and susceptible to MITM attacks.
      ATS (App Transport Security) blocks HTTP by default — explicit
      exceptions in Info.plist are a red flag.
    owasp: M3 – Insecure Communication
    detection:
      patterns:
        - '"http://'
        - "NSAllowsArbitraryLoads.*true"
    bad_example: |
      let url = URL(string: "http://api.example.com/users")!
    fix_example: |
      let url = URL(string: "https://api.example.com/users")!

  SEC-004:
    description: User-facing error messages do not expose internal details
    severity: MEDIUM
    rationale: >
      Stack traces, database errors, internal paths, and server-generated
      error messages reveal implementation details useful to attackers.
    owasp: M10 – Extraneous Functionality
    bad_example: |
      // ❌ Shows internal Firestore path and query details
      self.errorMessage = error.localizedDescription
      // → "PERMISSION_DENIED: Missing or insufficient permissions for path /users/uid123/private"
    fix_example: |
      // ✅ User-friendly message; internal details logged privately
      logger.error("Firestore fetch failed: \(error)")
      self.errorMessage = "Unable to load your profile. Please try again."

  SEC-005:
    description: Sensitive data not logged to console or crash reporters
    severity: HIGH
    rationale: >
      Console logs are readable by any app with a device connection.
      Crash reports (Crashlytics, Sentry) may transmit PII off-device.
    owasp: M9 – Insecure Data Storage
    bad_example: |
      print("User logged in: \(user.email) password=\(password)")
      logger.debug("Auth token: \(authToken)")
      Crashlytics.crashlytics().setCustomValue(user.ssn, forKey: "ssn")
    fix_example: |
      logger.debug("User authentication succeeded for userId: \(user.id.prefix(4))***")

  SEC-006:
    description: Certificate pinning considered for high-security endpoints
    severity: SUGGESTION
    rationale: >
      Certificate pinning prevents MITM attacks even when a rogue CA is trusted.
      Required for financial, healthcare, or authentication endpoints.
    guidance: >
      Flag endpoints that handle auth tokens, payments, or PII.
      Recommend TrustKit or URLSession certificate pinning if not already present.
