---
# Changelog & Release Notes Rules
# Validates CHANGELOG.md and release note quality.

rule_set:
  id: changelog
  label: "Changelog & Release Notes"
  phase: 4
  enabled: always
  format: "Keep a Changelog (https://keepachangelog.com)"

checks:

  REL-CHG-001:
    id: REL-CHG-001
    title: "CHANGELOG.md has an entry for the release version"
    severity: HIGH
    rationale: >
      Missing changelog entry means GitHub Releases, App Store release notes, and
      internal comms will have no automated source of truth for what changed.
    detection: "grep '## \\[{VERSION}\\]' CHANGELOG.md"
    fix: "Add a ## [{VERSION}] — {DATE} section at the top of CHANGELOG.md."

  REL-CHG-002:
    id: REL-CHG-002
    title: "Changelog entry includes the release date"
    severity: MEDIUM
    rationale: >
      Undated entries make it impossible to correlate user reports with releases
      without also checking git tags.
    pattern: "## \\[{VERSION}\\] — \\d{4}-\\d{2}-\\d{2}"
    fix: "## [2.1.0] — 2025-05-17"

  REL-CHG-003:
    id: REL-CHG-003
    title: "Breaking changes are explicitly marked"
    severity: CRITICAL
    rationale: >
      Consumers (other teams, public SDK users) depend on explicit breaking change
      notices to plan migration. A breaking change buried in 'Changed' causes
      integration failures that are difficult to debug.
    detection: "grep -i 'breaking' commits since last tag"
    fix: |
      Add a ### Breaking Changes section or mark individual items:
      - **BREAKING** Removed `OldAPI.fetch()` — use `NewAPI.load()` instead

  REL-CHG-004:
    id: REL-CHG-004
    title: "All user-facing changes are in the changelog"
    severity: HIGH
    rationale: >
      Changelog entries generated only from commit messages often miss UX changes
      that were committed with non-descriptive messages. Review the diff against
      the previous release and cross-check with the milestone issue list.
    detection: |
      git log $(git describe --tags --abbrev=0)..HEAD \
        --pretty=format:"- %s" --no-merges | grep -v "^- chore\|^- ci\|^- test"
    fix: "Manually review feature and fix commits and ensure all user-facing ones appear in the changelog."

  REL-CHG-005:
    id: REL-CHG-005
    title: "Changelog does not expose internal architecture or infrastructure details"
    severity: MEDIUM
    rationale: >
      App Store release notes and public GitHub releases are user-facing. Internal
      refactors, dependency upgrades (unless they fix user-visible issues), and
      CI changes should be omitted or grouped under a generic 'Internal improvements' entry.
    detect:
      - "Migrated from X to Y" (internal framework swap)
      - "Refactored * for performance" (without user-visible impact)
      - "Updated GitHub Actions"
      - "Bumped * from v1 to v2"
    fix: "Omit internal items or summarise as 'Internal improvements and dependency updates'."

  REL-CHG-006:
    id: REL-CHG-006
    title: "Changelog entries link to relevant PRs or issues"
    severity: LOW
    rationale: >
      PR/issue links make it easy to trace a shipped feature to its code review
      and requirements discussion. Particularly useful during incident response.
    fix: "Add (#PR_NUMBER) or (closes #ISSUE_NUMBER) at the end of each entry."
    fix_example: "- Fixed crash when opening empty cart (#234, closes #198)"

  REL-CHG-007:
    id: REL-CHG-007
    title: "[Unreleased] section cleared when release is cut"
    severity: MEDIUM
    rationale: >
      Keeping an [Unreleased] section with stale entries after a release confuses
      future contributors about what is actually pending vs. what shipped.
    detection: "grep '\\[Unreleased\\]' CHANGELOG.md"
    fix: "Rename [Unreleased] to [{VERSION}] — {DATE} and add a new empty [Unreleased] section."
