---
# GitHub PR Hygiene Rules
# Shared across all architecture skills (TCA, MVVM, VIPER)
# Applies to all pull requests regardless of architecture

rule_set:
  id: github_pr_hygiene
  name: GitHub PR Hygiene
  description: Pull request quality and team collaboration standards for iOS projects
  enabled: always
  thresholds:
    max_pr_diff_lines: 400
    ideal_pr_diff_lines: 200

checks:

  GH-001:
    description: PR diff is under 400 lines — suggest splitting if larger
    severity: MEDIUM
    rationale: >
      Research shows review quality drops sharply above 400 changed lines.
      Reviewers catch ~70% of bugs in small PRs but under 20% in large ones.
      Large PRs also make bisecting harder when regressions are found.
    detection: "gh pr diff <number> | wc -l"
    thresholds:
      ideal: 200
      acceptable: 400
      too_large: 400
    fix_guidance: |
      Split strategies:
      1. Feature flag split: ship infrastructure behind a flag, then UI
      2. Layer split: data layer PR → business logic PR → UI PR
      3. File split: one PR per major file changed
      4. Refactor-then-feature: preparatory refactor PR, then the feature

  GH-002:
    description: Branch name follows feature/, fix/, or chore/ convention
    severity: LOW
    rationale: >
      Consistent branch naming makes CI filters, branch protection rules,
      and automated changelogs work correctly.
    patterns:
      valid:
        - "feature/<ticket>-<short-description>"
        - "fix/<ticket>-<short-description>"
        - "chore/<description>"
        - "hotfix/<description>"
        - "release/<version>"
      invalid:
        - "gaurav-changes"
        - "wip"
        - "test123"
        - "main-copy"
    bad_example: "gauravparmar/cart-stuff"
    fix_example: "feature/PROJ-423-cart-checkout-flow"

  GH-003:
    description: PR description is non-empty and provides context
    severity: MEDIUM
    rationale: >
      An empty PR description forces reviewers to reverse-engineer intent
      from the diff. Good descriptions reduce review time and serve as
      documentation for future readers of the git history.
    minimum_content:
      - "What changed and why (1–3 sentences)"
      - "How to test the change"
      - "Screenshots or recordings for UI changes"
    fix_example: |
      ## Summary
      - Adds Firestore-backed cart persistence so items survive app restarts
      - Replaces in-memory CartStore with CartFirestoreService

      ## Test Plan
      - [ ] Add item to cart, force-quit app, reopen — items persist
      - [ ] Add 20+ items — verify .limit(50) pagination works
      - [ ] Offline mode — verify optimistic UI with pending indicator

      ## Screenshots
      | Before | After |
      |--------|-------|
      | ...    | ...   |

  GH-004:
    description: No merge commits in branch history
    severity: LOW
    rationale: >
      Merge commits from pulling main into a feature branch create noisy,
      non-linear history and make git bisect harder. Use rebase instead.
    detection: "git log --merges HEAD ^origin/main"
    fix_guidance: |
      # Instead of: git merge main
      git fetch origin
      git rebase origin/main

      # If you've already merged:
      git rebase --rebase-merges origin/main  # then force-push feature branch

  GH-005:
    description: CI workflow references SwiftLint, unit tests, and snapshot tests
    severity: LOW
    rationale: >
      PRs without CI gates allow formatting violations, test regressions, and
      broken snapshots to merge silently. All three checks should be required
      status checks on the main branch.
    detection: >
      Read .github/workflows/*.yml and check for steps invoking:
      swiftlint, xcodebuild test, and a snapshot test scheme or target.
    fix_example: |
      # .github/workflows/pr-checks.yml
      jobs:
        lint:
          steps:
            - run: swiftlint lint --strict

        test:
          steps:
            - run: xcodebuild test -scheme MyApp -destination 'platform=iOS Simulator,...'

        snapshot:
          steps:
            - run: xcodebuild test -scheme MyAppSnapshotTests -destination '...'

  GH-006:
    description: Code comments explain WHY, not WHAT — flag over-commented or trivially-commented code
    severity: LOW
    rationale: >
      Comments that restate what self-documenting code already says create noise,
      maintenance burden, and comments that silently drift out of sync with code.
      A missing comment is only a problem when the WHY is non-obvious — a hidden
      constraint, OS quirk, workaround, or surprising invariant.
      Well-named identifiers supersede comments.
    flag_when:
      - Non-obvious constraint, OS-version quirk, or framework workaround has no explanation
      - A surprising invariant or performance trade-off is unexplained
      - Behaviour that would confuse a future reader is not documented
      - TODO/FIXME has no ticket reference (overlaps MAINT-004)
    do_not_flag:
      - Functions and types whose name communicates intent
      - Standard Swift idioms (guard, map, forEach, Combine chains)
      - View body layout code — naming should be self-documenting
      - Test functions — the test name is the documentation
      - Trivial computed vars, getters, and simple transforms
    bad_example: |
      // Append item to the array
      items.append(item)

      // Returns true if user is authenticated
      var isAuthenticated: Bool { token != nil }
    good_example: |
      // iOS 16 bug: .searchable focus leaks across NavigationStack pushes.
      // Remove when minimum deployment target reaches iOS 17.
      .id(navigationPath.count)

      // Must run before notificationCenter.post — observers register synchronously.
      setupObservers()
